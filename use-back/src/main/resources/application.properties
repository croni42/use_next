spring.application.name=use-back
server.servlet.context-path=/api

# ADR-008 option D: server-side session, cookie flags, 30 min inactivity
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# Prototype assumption (R-17): one configured user. No default password: the hash must be provided
# (environment variable USENEXT_AUTH_PASSWORD_HASH or the dev profile).
usenext.auth.username=${USENEXT_AUTH_USERNAME:lasse}
usenext.auth.password-hash=${USENEXT_AUTH_PASSWORD_HASH}

# OCL evaluation limits: bounded pool, hard time limit per request
usenext.ocl.timeout=3s
usenext.ocl.threads=2
usenext.ocl.queue=4

# Optional fields (Problem.detail) are omitted instead of serialised as null
spring.jackson.default-property-inclusion=non_null

spring.application.name=use-back
server.servlet.context-path=/api

# ADR-008 option D: server-side session, cookie flags, 30 min inactivity
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# Prototype assumption (R-17): one configured user. No default password: the hash must be provided
# (environment variable POC_AUTH_PASSWORD_HASH or the dev profile).
poc.auth.username=${POC_AUTH_USERNAME:lasse}
poc.auth.password-hash=${POC_AUTH_PASSWORD_HASH}

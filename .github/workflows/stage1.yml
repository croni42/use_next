name: stage1

on:
  pull_request:
  push:
    branches: [main, 'WIP-**', 'feature/**']
  workflow_dispatch:

concurrency:
  group: stage1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # use-core is built from the pinned upstream commit on every run (--force), so the cached
      # Maven repository can never supply a stale or unverified use-core.
      - run: bash scripts/install-use-core.sh --force
      - run: ./mvnw -B verify
        working-directory: use-back
      - name: Test report
        if: always()
        run: bash scripts/ci-summary.sh tests "Backend tests" use-back/target/surefire-reports/TEST-*.xml >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: use-web/package-lock.json
      - run: npm ci
        working-directory: use-web
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
        working-directory: use-web
      - name: Test report
        if: always()
        run: bash scripts/ci-summary.sh tests "Frontend tests" use-web/test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - run: npm run lint
        working-directory: use-web
      - run: npm run format:check
        working-directory: use-web
      - run: npm run build
        working-directory: use-web
      - name: Result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Frontend checks"
            echo
            echo "**$JOB_STATUS** - eslint, Prettier and production build"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: use-web/package-lock.json
      - run: bash scripts/check-drift.sh
      - name: Result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## API client drift"
            echo
            echo "**$JOB_STATUS** - committed client matches openapi/openapi.yaml"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  openapi-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: use-web/package-lock.json
      - run: npm ci
        working-directory: use-web
      - run: npm run lint:api
        working-directory: use-web
      - name: Result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## OpenAPI lint"
            echo
            echo "**$JOB_STATUS** - Spectral ruleset openapi/.spectral.yaml"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  # CI-only tools below: pinned release binaries, verified against the SHA-256 recorded here
  # (taken from the release's checksum file). They need no token, key or account.

  oasdiff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install oasdiff 1.33.0
        run: |
          curl -fsSL -o oasdiff.tar.gz https://github.com/oasdiff/oasdiff/releases/download/v1.33.0/oasdiff_1.33.0_linux_amd64.tar.gz
          echo "43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247  oasdiff.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf oasdiff.tar.gz -C "$RUNNER_TEMP/bin" oasdiff
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Compare against the base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="origin/$BASE_REF" ;;
            push)
              # Push: compare with the previous tip of the branch; a new branch has none.
              if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
                echo "::notice::New branch, no previous tip to compare against; breaking-change check skipped."
                exit 0
              fi
              base="$BEFORE_SHA" ;;
            *) base="origin/main" ;;
          esac
          bash scripts/check-breaking.sh "$base"
      - name: Result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Breaking API changes"
            echo
            echo "**$JOB_STATUS** - oasdiff comparison against the base"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  osv-scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OSV-Scanner 2.6.0
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  $RUNNER_TEMP/bin/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # --no-resolve: only the dependencies declared in pom.xml are checked; the transitive Maven
      # resolution cannot run because use-core is not in Maven Central.
      - name: Scan
        run: osv-scanner scan source --config=osv-scanner.toml --no-resolve -L use-back/pom.xml -L use-web/package-lock.json 2>&1 | tee osv-result.txt
      - name: Scan report
        if: always()
        run: |
          {
            echo "## OSV-Scanner"
            echo
            echo '```text'
            cat osv-result.txt 2>/dev/null || echo "No scan output."
            echo '```'
            echo
            bash scripts/ci-summary.sh exceptions osv-scanner.toml
          } >> "$GITHUB_STEP_SUMMARY"

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: gitleaks git --redact --no-banner .
      - name: Result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Secret scan"
            echo
            echo "**$JOB_STATUS** - gitleaks over the full git history"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

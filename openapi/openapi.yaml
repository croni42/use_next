openapi: 3.0.3
info:
  title: USE_NEXT API
  version: 0.0.1
servers:
  - url: /api
paths:
  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [auth]
      summary: Returns the CSRF token for the current session
      security: []
      responses:
        '200':
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticates and sets the session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in, session cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Login failed (same response for unknown user and wrong password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Returns the user of the current session
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Invalidates the server-side session
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /ocl/evaluate:
    post:
      operationId: evaluateOcl
      tags: [ocl]
      summary: Evaluates an OCL expression against the fixed server-side model
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OclEvaluationRequest'
      responses:
        '200':
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OclEvaluationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: The expression does not compile or its evaluation failed; detail carries a sanitised message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Evaluation exceeded the time limit or the server is busy
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  responses:
    BadRequest:
      description: Request body failed server-side validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Missing or invalid CSRF token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
        token:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
    UserInfo:
      type: object
      required: [username]
      properties:
        username:
          type: string
    OclEvaluationRequest:
      type: object
      required: [expression]
      properties:
        expression:
          type: string
          minLength: 1
          maxLength: 1000
    OclEvaluationResult:
      type: object
      required: [result]
      properties:
        result:
          type: string
          maxLength: 10000
          description: Result in USE notation; longer results are cut off server-side
    Problem:
      type: object
      required: [status, title]
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
          maxLength: 500
          description: Plain-text, sanitised explanation; never contains stack traces, paths or class names
